<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>更新說明彈窗：特價車上線</title>
<style>
  /* The 更新說明彈窗 picture for 特價車, 704×875 like 2026-10-21 (三個新功能上線): the blue curved
     header with the mark and name, a small label, the title, three rows with a coloured tag each,
     and where to start. 特價車 is the driver's own route with a link passengers book on directly
     (docs/marketing/deal-guide/). 2026-10-22-zh-Hans.html is made from this file. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 704px; height: 875px; overflow: hidden; }
  body {
    position: relative;
    background: #edf2f7;
    font-family: 'PingFang TC', 'PingFang HK', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    color: #142033;
  }
  .head {
    position: absolute; inset: 0 0 auto 0; height: 232px;
    background: linear-gradient(110deg, #2f5fd8 0%, #3a6fdc 55%, #4a86d4 100%);
    border-radius: 0 0 50% 50% / 0 0 46px 46px;
    display: flex; align-items: center; justify-content: center; gap: 34px;
    padding-bottom: 20px;
  }
  .head__name { color: #fff; }
  .head__name strong { display: block; font-size: 56px; font-weight: 800; letter-spacing: 3px; line-height: 1.15; }
  .head__name span { display: block; margin-top: 8px; font-size: 26px; font-weight: 600; letter-spacing: 1.5px; opacity: 0.95; }

  .body { position: absolute; top: 264px; left: 44px; right: 44px; }
  .label { font-size: 25px; font-weight: 700; color: #2f5fd8; }
  h1 { margin-top: 6px; font-size: 62px; font-weight: 800; letter-spacing: 2px; line-height: 1.2; }

  .rows { margin-top: 26px; display: grid; gap: 18px; }
  .row {
    display: flex; align-items: center; gap: 24px;
    height: 104px; padding: 0 28px; border-radius: 26px; background: #fff;
  }
  .tag {
    flex: none; width: 112px; height: 60px; border-radius: 30px;
    display: grid; place-items: center; font-size: 30px; font-weight: 800;
  }
  .tag--route { background: #e5edfb; color: #1749a8; }
  .tag--price { background: #dff4f2; color: #0a7470; }
  .tag--link { background: #fff3d6; color: #8a5a00; }
  .row p { font-size: 29px; font-weight: 600; color: #2b3a4f; }

  .direct { margin-top: 22px; text-align: center; font-size: 27px; font-weight: 700; color: #1749a8; }
  .start { margin-top: 10px; text-align: center; font-size: 25px; color: #556579; }
  .start b {
    display: inline-block; margin: 0 4px; padding: 2px 16px; border-radius: 12px;
    background: #2f5fd8; color: #fff; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="head">
    <svg width="132" height="100" viewBox="0 0 50 38" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M33.9404 28.3711V29.5554L34.919 30.1218L35.949 29.5554V28.3711L34.919 27.8047L33.9404 28.3711Z" fill="white"/>
      <path d="M30.1289 0C23.6396 0 17.9743 3.24391 14.5237 8.13551C6.43779 8.34147 0 14.9323 0 23.0678C0 31.3062 6.6953 38 14.9357 38C15.0387 38 15.1417 38 15.2447 38H29.9743C30.0258 38 30.0774 38 30.1289 38C30.1804 38 30.2319 38 30.2834 38H30.4379C40.7898 37.8455 49.1332 29.4011 49.1332 19C49.1332 8.49595 40.6353 0 30.1289 0ZM13.0816 27.8049L8.9614 26.5176L17.2533 12.3577L21.3735 13.645L13.0816 27.8049ZM16.2232 26.5176L24.5151 12.3577L28.6353 13.645L20.3434 27.8049L16.2232 26.5176ZM37.6482 30.5339L34.9186 32.0786L32.1889 30.5339V27.393L33.7855 26.4661V17.0949L27.5537 27.8049L23.4336 26.5176L31.7254 12.3577L35.8456 13.645H36.1031V26.5176L37.6997 27.4444V30.5339H37.6482Z" fill="white"/>
    </svg>
    <div class="head__name">
      <strong>跨境師傅幫</strong>
      <span>MasterDriver</span>
    </div>
  </div>

  <div class="body">
    <p class="label">師傅幫更新</p>
    <h1>特價車上線</h1>

    <div class="rows">
      <div class="row"><span class="tag tag--route">路線</span><p>開你自己的專屬路線</p></div>
      <div class="row"><span class="tag tag--price">價錢</span><p>每組一個包車價，你自己定</p></div>
      <div class="row"><span class="tag tag--link">下單</span><p>乘客用專屬連結直接找你</p></div>
    </div>

    <p class="direct">司機乘客直接對接，不經任何中介</p>
    <p class="start">首頁按<b>特價車</b>開始</p>
  </div>
</body>
</html>
