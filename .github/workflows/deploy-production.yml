name: Deploy production

# Every push to `main` is released: quality gates, images, database backup,
# migration, API candidate revision, smoke tests, traffic, then the two
# static apps. See docs/PRODUCTION-DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml

  deploy:
    needs: quality-gates
    # Until the Google Cloud resources and the `production` environment's
    # variables exist, a push to main only runs the quality gates.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Verify commit is still current on main
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$remote_sha" ]]; then
            printf 'Unable to resolve origin/main; refusing production deployment.\n' >&2
            exit 1
          fi
          if [[ "$remote_sha" != "${GITHUB_SHA}" ]]; then
            printf 'Refusing stale production deployment: workflow_sha=%s current_main=%s\n' \
              "$GITHUB_SHA" "$remote_sha" >&2
            exit 1
          fi
          printf 'Production commit is current: %s\n' "$GITHUB_SHA"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build production frontends
        run: |
          set -euo pipefail
          npm ci
          npm run build:web
          npm run build:admin

      - name: Build and push immutable frontend images
        id: frontends
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}"
          while IFS='|' read -r name source; do
            image="${registry}/${name}:${GITHUB_SHA}"
            ./deploy/frontend/build-image.sh "$name" "$source" "$image"
            digest="$(gcloud artifacts docker images describe "$image" --format='value(image_summary.digest)')"
            printf '%s=%s@%s\n' "$name" "${image%:*}" "$digest" >> "$GITHUB_OUTPUT"
          done <<'EOF'
          web|web/dist
          admin|admin/dist
          EOF

      - name: Build and push immutable API image
        id: image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/api:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx build \
            --platform linux/amd64 \
            --file backend/Dockerfile \
            --tag "$image" \
            --push \
            --provenance=false \
            .
          digest="$(gcloud artifacts docker images describe "$image" --format='value(image_summary.digest)')"
          printf 'image=%s@%s\n' "${image%:*}" "$digest" >> "$GITHUB_OUTPUT"

      - name: Verify commit before database backup
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_sha" != "${GITHUB_SHA}" ]]; then
            printf 'Refusing stale database mutation: workflow_sha=%s current_main=%s\n' \
              "$GITHUB_SHA" "$remote_sha" >&2
            exit 1
          fi
          printf 'Database mutation authorized for current commit: %s\n' "$GITHUB_SHA"

      - name: Create pre-migration database backup
        run: >-
          gcloud sql backups create
          --project "${{ vars.GCP_PROJECT_ID }}"
          --instance "${{ vars.GCP_SQL_INSTANCE_NAME }}"
          --description "pre-release-${GITHUB_SHA}"

      - name: Verify commit before production mutation
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_sha" != "${GITHUB_SHA}" ]]; then
            printf 'Refusing stale production mutation: workflow_sha=%s current_main=%s\n' \
              "$GITHUB_SHA" "$remote_sha" >&2
            exit 1
          fi
          printf 'Production mutation authorized for current commit: %s\n' "$GITHUB_SHA"

      - name: Migrate, deploy candidate, and promote
        id: api
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE_NAME: ${{ vars.GCP_API_SERVICE }}
          MIGRATION_JOB: ${{ vars.GCP_MIGRATION_JOB }}
          IMAGE: ${{ steps.image.outputs.image }}
          CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_CONNECTION_NAME }}
          SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          MIGRATION_SERVICE_ACCOUNT: ${{ vars.GCP_MIGRATION_SERVICE_ACCOUNT }}
          DATABASE_SECRET: ${{ vars.GCP_DATABASE_URL_SECRET }}
          OTP_PEPPER_SECRET: ${{ vars.GCP_OTP_PEPPER_SECRET }}
          DATA_ENCRYPTION_KEY_SECRET: ${{ vars.GCP_DATA_ENCRYPTION_KEY_SECRET }}
          PUBLIC_BASE_URL: ${{ vars.PRODUCTION_WEB_URL }}
          SUPPORT_MEDIA_BUCKET: ${{ vars.GCP_SUPPORT_MEDIA_BUCKET }}
          # Space-separated Cloud Run jobs that run from the API image.
          FOLLOWING_JOBS: ${{ vars.GCP_FOLLOWING_JOBS }}
        run: |
          set -euo pipefail
          ./deploy/cloud-run/deploy.sh
          url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Verify commit before frontend mutation
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_sha" != "${GITHUB_SHA}" ]]; then
            printf 'Refusing stale frontend mutation: workflow_sha=%s current_main=%s\n' \
              "$GITHUB_SHA" "$remote_sha" >&2
            exit 1
          fi
          printf 'Frontend mutation authorized for current commit: %s\n' "$GITHUB_SHA"

      - name: Deploy production frontends
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE_ACCOUNT: ${{ vars.GCP_FRONTEND_SERVICE_ACCOUNT }}
          # The static apps reach the API through their own /api proxy.
          API_ORIGIN: ${{ steps.api.outputs.url }}
        run: |
          set -euo pipefail
          while IFS='|' read -r service image; do
            SERVICE_NAME="$service" IMAGE="$image" ./deploy/frontend/deploy.sh
          done <<EOF
          ${{ vars.GCP_WEB_SERVICE }}|${{ steps.frontends.outputs.web }}
          ${{ vars.GCP_ADMIN_SERVICE }}|${{ steps.frontends.outputs.admin }}
          EOF
