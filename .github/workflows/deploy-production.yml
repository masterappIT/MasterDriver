name: Deploy production

# Every push to `main` is released: quality gates, images, database backup,
# migration, API candidate, checks, traffic, then the two static apps. Images go
# to Artifact Registry; the HostKVM server runs them (deploy/hostkvm/deploy.sh,
# reached over SSH by an account that can run nothing else). See
# docs/PRODUCTION-DEPLOYMENT.md and docs/HOSTKVM-MIGRATION.md.
on:
  push:
    branches: [main]
    # A push that only changes documents is not released (workflow_dispatch still is).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # The server and its host key, fixed here so a connection to anything else fails.
  DEPLOY_HOST: 45.134.82.239
  DEPLOY_USER: deploy-masterdriver
  DEPLOY_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIfLOO+u+1eL4NfB87NjjvQm6GWt7b4ZKianVO7bGRGD

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml

  deploy:
    needs: quality-gates
    # Until the Google Cloud resources and the `production` environment's
    # variables exist, a push to main only runs the quality gates.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Verify commit is still current on main
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$remote_sha" ]]; then
            printf 'Unable to resolve origin/main; refusing production deployment.\n' >&2
            exit 1
          fi
          if [[ "$remote_sha" != "${GITHUB_SHA}" ]]; then
            printf 'Refusing stale production deployment: workflow_sha=%s current_main=%s\n' \
              "$GITHUB_SHA" "$remote_sha" >&2
            exit 1
          fi
          printf 'Production commit is current: %s\n' "$GITHUB_SHA"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build production frontends
        run: |
          set -euo pipefail
          npm ci
          npm run build:web
          npm run build:admin

      - name: Build and push immutable frontend images
        id: frontends
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}"
          while IFS='|' read -r name source; do
            image="${registry}/${name}:${GITHUB_SHA}"
            ./deploy/frontend/build-image.sh "$name" "$source" "$image"
            digest="$(gcloud artifacts docker images describe "$image" --format='value(image_summary.digest)')"
            printf '%s=%s@%s\n' "$name" "${image%:*}" "$digest" >> "$GITHUB_OUTPUT"
          done <<'EOF'
          web|web/dist
          admin|admin/dist
          EOF

      - name: Build and push immutable API image
        id: image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/api:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg DBIP_RELEASE="$(date -u +%Y-%m)" \
            --file backend/Dockerfile \
            --tag "$image" \
            --push \
            --provenance=false \
            .
          digest="$(gcloud artifacts docker images describe "$image" --format='value(image_summary.digest)')"
          printf 'image=%s@%s\n' "${image%:*}" "$digest" >> "$GITHUB_OUTPUT"

      - name: Verify commit before database backup
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_sha" != "${GITHUB_SHA}" ]]; then
            printf 'Refusing stale database mutation: workflow_sha=%s current_main=%s\n' \
              "$GITHUB_SHA" "$remote_sha" >&2
            exit 1
          fi
          printf 'Database mutation authorized for current commit: %s\n' "$GITHUB_SHA"

      - name: Connect to the production server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.MASTERDRIVER_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          ssh production status

      - name: Create pre-migration database backup
        run: |
          # The arguments are filled in here on purpose; the server checks each one.
          # shellcheck disable=SC2029
          ssh production backup "$GITHUB_SHA"

      - name: Verify commit before production mutation
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_sha" != "${GITHUB_SHA}" ]]; then
            printf 'Refusing stale production mutation: workflow_sha=%s current_main=%s\n' \
              "$GITHUB_SHA" "$remote_sha" >&2
            exit 1
          fi
          printf 'Production mutation authorized for current commit: %s\n' "$GITHUB_SHA"

      - name: Migrate, deploy candidate, and promote
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          # The arguments are filled in here on purpose; the server checks each one.
          # shellcheck disable=SC2029
          ssh production api "$GITHUB_SHA" "${IMAGE#*@}"

      - name: Verify commit before frontend mutation
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_sha" != "${GITHUB_SHA}" ]]; then
            printf 'Refusing stale frontend mutation: workflow_sha=%s current_main=%s\n' \
              "$GITHUB_SHA" "$remote_sha" >&2
            exit 1
          fi
          printf 'Frontend mutation authorized for current commit: %s\n' "$GITHUB_SHA"

      - name: Deploy production frontends
        env:
          WEB_IMAGE: ${{ steps.frontends.outputs.web }}
          ADMIN_IMAGE: ${{ steps.frontends.outputs.admin }}
        run: |
          # The arguments are filled in here on purpose; the server checks each one.
          # shellcheck disable=SC2029
          ssh production frontends "$GITHUB_SHA" "${WEB_IMAGE#*@}" "${ADMIN_IMAGE#*@}"

      - name: Check the public site
        env:
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        run: curl --fail --silent --show-error --max-time 20 "$WEB_URL/api/health/ready"
