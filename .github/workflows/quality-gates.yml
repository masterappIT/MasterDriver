name: Quality gates

# `main` is covered by "Deploy production", which runs these gates before it deploys.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: master_driver
          POSTGRES_PASSWORD: master_driver
          POSTGRES_DB: master_driver
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U master_driver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://master_driver:master_driver@localhost:5434/master_driver
      TEST_DATABASE_URL: postgresql://master_driver:master_driver@localhost:5434/master_driver_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:api
      - run: npm run test:api:db
      - run: npm run verify:admin
      - run: npm run verify:web
      - name: Check deployment scripts
        run: |
          set -euo pipefail
          for script in deploy/cloud-run/*.sh deploy/frontend/*.sh; do bash -n "$script"; done
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cloud-run/test_revision_ready.py
