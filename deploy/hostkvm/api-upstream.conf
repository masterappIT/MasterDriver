# Where the front ends' nginx sends /api on the HostKVM server (mounted into /etc/nginx/conf.d/,
# with API_ORIGIN=http://masterdriver_api). Both API slots are listed and looked up again every
# 5 seconds through Docker's DNS: only a running slot joined to the `masterdriver` network is found,
# so the deploy script decides which slot takes traffic. Cloud Run does not use this file.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream masterdriver_api {
  zone masterdriver_api 64k;
  server masterdriver-api-a:8080 resolve;
  server masterdriver-api-b:8080 resolve;
}
