# Where the front ends' nginx sends /api on the HostKVM server (mounted into /etc/nginx/conf.d/,
# with API_ORIGIN=http://masterdriver_api). Cloud Run does not use this file.
#
# Both API slots answer to one name on the `masterdriver` network, masterdriver-api, which the deploy
# script gives a slot when it joins (2026-10-23). nginx looks the name up again every 5 seconds through
# Docker's DNS. A slot is running whenever the API is, so the name always resolves; during a release it
# gives both slots, so the new one takes traffic within 5 seconds, and a request the stopping slot
# refuses is sent to the other. Each slot's own name was listed before: the one not running could not
# be found, and nginx tried a name that failed only every 30 seconds, so a new slot could go unseen
# while the old one had already stopped (502s for about 20 seconds on 2026-10-22, 19:05 UTC).
# Those names stay as a fallback, for an API slot started before it was given the shared name: a front
# end restarted with this file before that slot's release still reaches it.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream masterdriver_api {
  zone masterdriver_api 64k;
  server masterdriver-api:8080 resolve;
  server masterdriver-api-a:8080 resolve;
  server masterdriver-api-b:8080 resolve;
}
