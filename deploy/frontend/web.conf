# The driver and passenger web app. ${API_ORIGIN} is filled in when the container starts.

# Chat apps fetching a pasted link to draw its preview (WhatsApp, Facebook and Messenger, iMessage,
# Telegram, LINE, X, LinkedIn, Slack, Discord). Only these are sent to the API's link-preview page
# below; people opening a link get the app as usual (docs/DESIGN.md, 連結預覽).
map $http_user_agent $link_preview_robot {
  default 0;
  ~*(WhatsApp|facebookexternalhit|Facebot|TelegramBot|Twitterbot|LinkedInBot|Slackbot|Discordbot|SkypeUriPreview|line-poker) 1;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

  # 客服 videos are up to 25 MB (shared/src/support.ts); the API enforces the exact limits.
  client_max_body_size 26m;

  add_header X-Content-Type-Options nosniff always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # The API keeps its /api prefix. Uploads and downloads stream straight
  # through: a Cloud Run instance's disk is memory, so nothing is buffered to it.
  location /api/ {
    proxy_pass ${API_ORIGIN};
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Whether the site may be indexed is decided in the platform admin (SEO).
  location = /robots.txt {
    proxy_pass ${API_ORIGIN}/api/public/robots.txt;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
  }

  # Vite puts a content hash in every file name under /assets/, so these never change.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # The home page: to a link-preview robot, the wide picture and the home words from the API; to
  # everyone else, the app with the home tags it was built with (index.html).
  location = / {
    if ($link_preview_robot) {
      rewrite ^ /api/public/link-preview?path=/ break;
      proxy_pass ${API_ORIGIN};
    }
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    try_files /index.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # A 名片頁 (/p/), a passenger's confirmation link (/c/) or a 搶單 link (/o/): to a link-preview
  # robot, the preview tags the API makes for that link; to everyone else, the app with that link's
  # own tags put in place of the home ones (index.html), which is what iOS's share menu hands WeChat.
  location ~ ^/(?<link_path>[pco]/[A-Za-z0-9_-]+)/?$ {
    if ($link_preview_robot) {
      rewrite ^ /api/public/link-preview?path=$uri break;
      proxy_pass ${API_ORIGIN};
    }
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    ssi on;
    ssi_silent_errors on;
    try_files /index.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # One link's tags for the page above. A slow or failed answer leaves the home tags, so a page
  # never waits long on it.
  location ^~ /__link-tags/ {
    internal;
    rewrite ^/__link-tags(/.*)$ /api/public/link-preview/tags?path=$1 break;
    proxy_pass ${API_ORIGIN};
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 1s;
    proxy_send_timeout 1s;
    proxy_read_timeout 2s;
  }

  # Every other path is a page of the single-page app.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
  }
}
